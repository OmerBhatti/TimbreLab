[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-audio-playground"
version = "0.1.0"
description = "PyQt desktop studio for OmniVoice TTS and AudioLDM sound effects"
requires-python = ">=3.10,<3.13"
dependencies = [
    "PyQt6>=6.7,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ai-audio-playground = "audio_playground.app:main"

[tool.setuptools.packages.find]
include = ["audio_playground*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
